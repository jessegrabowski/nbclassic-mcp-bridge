[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["C", "E", "F", "I", "UP", "W", "RUF", "PERF", "PTH", "ISC", "T20"]
ignore = ["C408", "C901", "E501", "E741", "RUF012", "PERF203", "ISC001"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["nbclassic_mcp_bridge", "nbclassic_mcp_bridge_mcp"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "E402", "F403"]

[tool.pytest.ini_options]
testpaths = ["extension/tests", "mcp_server/tests"]
markers = [
    "e2e: end-to-end browser test; needs playwright + chromium (deselect with -m 'not e2e')",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.dependencies]
python = ">=3.12"
nbclassic = ">=1.3"

[tool.pixi.pypi-dependencies]
nbclassic-mcp-bridge = { path = "extension", editable = true }
nbclassic-mcp-bridge-mcp = { path = "mcp_server", editable = true }

[tool.pixi.feature.test.pypi-dependencies]
pytest = "*"
pytest-randomly = "*"
playwright = "*"

[tool.pixi.feature.test.tasks]
unit = "pytest -m 'not e2e'"
e2e = "pytest -m e2e"
tests = { depends-on = ["unit", "e2e"] }
install-browsers = "playwright install chromium"

[tool.pixi.feature.lint.dependencies]
pre-commit = "*"

[tool.pixi.feature.lint.tasks]
lint = "pre-commit run --all-files"

[tool.pixi.environments]
default = { features = ["test"], solve-group = "default" }
lint = { features = ["lint"], no-default-feature = true }

