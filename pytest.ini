; Root config so `pytest` (or `pytest mcp_server extension`) works from the repo root with the
; e2e marker registered; each package's pyproject still governs runs from inside that package.
[pytest]
testpaths = extension/tests mcp_server/tests
markers =
    e2e: end-to-end browser test; needs playwright + chromium (deselect with -m 'not e2e')
