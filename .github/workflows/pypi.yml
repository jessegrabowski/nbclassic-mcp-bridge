name: PyPI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  build:
    name: build and inspect ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [extension, mcp_server]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # hatch-vcs derives both package versions from the repo-root git history
          fetch-depth: 0
      - uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5 # v3.0.1
        with:
          path: ${{ matrix.package }}
          upload-name-suffix: -${{ matrix.package }}

  publish:
    name: upload ${{ matrix.package }} to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    if: github.repository_owner == 'jessegrabowski' && github.event_name == 'release' && github.event.action == 'published'
    # One job per package, so a problem with one project's trusted publisher cannot stop the other
    # from being released.
    strategy:
      fail-fast: false
      matrix:
        package: [extension, mcp_server]
    # Use the `release` GitHub environment to protect the Trusted Publishing (OIDC)
    # workflow by requiring signoff from a maintainer.
    environment: release
    permissions:
      # write id-token is necessary for trusted publishing (OIDC)
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages-${{ matrix.package }}
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # An upload that dies partway leaves files on PyPI that can never be re-uploaded, so a
          # rerun must skip them instead of aborting on the first one.
          skip-existing: true
