name: run_tests

on:
  pull_request:
  push:
    branches: [main]

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
  # The concurrency group contains the workflow name and the branch name for pull requests
  # or the commit hash for any other events.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - subset-name: "Unit and integration"
            task: unit
            marker: "not e2e"

          - subset-name: "Browser e2e"
            task: e2e
            marker: "e2e"

    name: ${{ matrix.subset-name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # hatch-vcs derives both package versions from git history
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          cache: true

      - name: Install playwright browsers
        if: matrix.task == 'e2e'
        # --with-deps pulls the OS libraries Chromium needs on a bare ubuntu runner.
        run: pixi run -- playwright install --with-deps chromium

      - name: Run tests
        run: >
          pixi run pytest -m "${{ matrix.marker }}" -vv --durations=20
          --cov=nbclassic_mcp_bridge --cov=nbclassic_mcp_bridge_mcp
          --cov-report=xml:coverage/coverage-${{ matrix.task }}.xml --cov-report=term

      - name: Upload coverage file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.task }}
          path: coverage/coverage-${{ matrix.task }}.xml

  js-test:
    name: "Extension JS tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Run JS tests with coverage
        run: |
          mkdir -p coverage
          node --test --experimental-test-coverage --test-coverage-exclude='extension/tests/**' \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=coverage/coverage-js.lcov \
            extension/tests/js/*.test.js

      - name: Upload coverage file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-js
          path: coverage/coverage-js.lcov

  all-checks:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    name: "All tests"
    needs: [test, js-test]
    steps:
      - name: Check build matrix status
        if: ${{ needs.test.result != 'success' || needs.js-test.result != 'success' }}
        run: exit 1

  upload-coverage:
    runs-on: ubuntu-latest
    name: "Upload coverage"
    needs: [all-checks]
    if: ${{ needs.all-checks.result == 'success' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download coverage files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true

      # Move the JS lcov out so the Python upload's directory search sees only cobertura XMLs.
      - name: Separate JS coverage from Python reports
        run: |
          mkdir -p coverage-js
          mv coverage/coverage-js.lcov coverage-js/

      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: jessegrabowski/nbclassic-mcp-bridge
          directory: ./coverage/
          fail_ci_if_error: true
          flags: python

      - name: Upload JS coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: jessegrabowski/nbclassic-mcp-bridge
          files: coverage-js/coverage-js.lcov
          disable_search: true
          fail_ci_if_error: true
          flags: javascript
